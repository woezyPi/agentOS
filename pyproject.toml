[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-clone"
version = "0.1.0"
description = "Assistant de code CLI multi-agents (superviseur + codeur) sur LangGraph, pour modèles compatibles OpenAI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "openai>=1.0",
    "pydantic>=2",
    "langchain-openai>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-mcp-adapters>=0.1",
    "httpx>=0.27",
    "rich>=13",
    "prompt-toolkit>=3.0",
    "fastapi>=0.110",   # cc-web
    "uvicorn>=0.29",    # cc-web
    "pyyaml>=6",        # skills, scanner de stack
    "packaging>=23",    # scanner de stack (comparaison de versions)
]

[project.optional-dependencies]
dev = ["playwright"]  # test navigateur du front

[project.scripts]
cc = "claude_clone.main:cli"
cc-web = "claude_clone.server:cli"

[tool.setuptools]
packages = ["claude_clone"]

[tool.setuptools.package-data]
claude_clone = ["static/*.html", "skills/*/SKILL.md"]
