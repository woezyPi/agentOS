@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{color-scheme:dark;--bg:#080808;--rail:#0e0e0e;--line:#303030;--text:#f3f0e9;--soft:#d2cfc8;--quiet:#a09d96;--orange:#c7fb5b;--pink:#ff5eac;--sky:#5cc8ff;--lime:#c7fb5b;--mono:'DM Mono',monospace;--sans:'DM Sans',Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}body{font-family:var(--sans);font-size:16px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--pink);outline-offset:3px}button{border:0}::selection{background:var(--pink);color:#090909}

.message-role small{display:block;margin-top:4px;font:9px/1.4 var(--mono);color:var(--quiet);text-transform:none;word-break:break-all}
.live-text{font:11px/1.5 var(--mono);color:var(--soft);border-left:2px solid var(--ac,var(--orange));padding:4px 9px;margin:8px 0 2px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:96px;overflow:hidden;background:#0c0c0c}
.agent-card.wide{grid-column:1/-1;order:99}.blk.narr{color:var(--quiet);font-size:12px;line-height:1.6;border-left:2px solid var(--line);padding-left:10px;margin:0 0 8px}
.content{transition:width .25s}.content.wide{width:100%}
.agent-grid{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);overflow-x:auto;padding-bottom:6px;margin-left:-96px;width:calc(100% + 96px)}
@media(min-width:851px){.message-content>.agent-grid:first-child{margin-top:68px}}
.agent-grid:has(.agent-card:nth-child(4)) .agent-card{font-size:11px}.agent-grid:has(.agent-card:nth-child(4)) .agent-card header .pill.model{display:none}.agent-grid:has(.agent-card:nth-child(4)) .agent-card .task{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.agent-card.wide{grid-column:auto;order:99}
@media(max-width:850px){.agent-grid{margin-left:0;width:auto;grid-auto-flow:row;grid-auto-columns:auto;grid-template-columns:1fr;overflow-x:visible}}
@media(max-width:1380px){.model-select{max-width:142px;font-size:10px;padding:9px 8px}.top-right,.controls{gap:6px}}

.fp{text-decoration:underline dotted var(--quiet);text-underline-offset:3px;cursor:text}body.ctrl .fp{color:var(--orange);text-decoration:underline;cursor:pointer}
.fileview{position:fixed;top:0;right:0;bottom:0;width:min(760px,94vw);background:#0b0b0b;border-left:1px solid var(--line);z-index:18;display:flex;flex-direction:column;box-shadow:-18px 0 50px #000a}.fileview[hidden]{display:none}
.fileview header{display:flex;align-items:center;gap:10px;padding:0 14px;height:52px;flex:none;border-bottom:1px solid var(--line)}.fileview header b{font:12px var(--mono);color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.fileview header button,.fileview header a{background:transparent;border:1px solid var(--line);color:var(--soft);font:9px var(--mono);padding:6px 9px;letter-spacing:.5px;text-decoration:none;white-space:nowrap}.fileview header button:hover,.fileview header a:hover{color:var(--text);border-color:var(--orange)}
#fvBody{flex:1;overflow:auto;font:12px/1.6 var(--mono)}.fv-row{display:grid;grid-template-columns:56px minmax(0,1fr)}.fv-row i{font-style:normal;text-align:right;padding:0 10px 0 0;color:var(--quiet);user-select:none;background:#0e0e0e}.fv-row>span{white-space:pre-wrap;overflow-wrap:anywhere;padding:0 12px}.fv-row.hit{background:#2a1d08;box-shadow:inset 2px 0 var(--orange)}.fv-row.hit i{color:var(--orange)}
.fv-note{font:11px/1.6 var(--mono);color:var(--soft);padding:14px}.fv-note button{display:block;margin:6px 0;background:transparent;border:1px solid var(--line);color:var(--text);padding:7px 10px;font:11px var(--mono);cursor:pointer}.fv-note button:hover{border-color:var(--orange)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1a1a1a;border:1px solid var(--pink);color:var(--text);font:11px var(--mono);padding:9px 14px;z-index:30;max-width:90vw}
.status-phase{margin-right:2px}
/* carte sous-agent : tâche lisible, étapes sur une ligne, texte en direct rendu */
.agent-card .task{font:13px/1.55 var(--sans);color:var(--soft);border-left:2px solid var(--ac);padding:1px 0 1px 10px;margin:2px 0 12px;-webkit-line-clamp:3}
.agent-card .step{flex-wrap:nowrap}
.agent-card .s-name{flex:none}
.agent-card .s-sum{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-card .s-sum .k{color:#6a6a6a}.agent-card .s-sum .v{color:var(--soft)}
.agent-card .s-st{flex:none}
.agent-card .step .fp{text-decoration:none;cursor:inherit}
.agent-card .step.run .s-st{animation:pulse 1.1s ease-in-out infinite}
.agent-card .live-text{font:13px/1.6 var(--sans);color:var(--soft);max-height:130px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 10px;margin:10px 0 2px;border-left:2px solid var(--ac);background:linear-gradient(90deg,#101010,#0a0a0a);-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 38%);mask-image:linear-gradient(to bottom,transparent 0,#000 38%)}
.agent-card .live-text>div{white-space:pre-wrap;overflow-wrap:anywhere}
.agent-card .live-text .code{margin:6px 0;font-size:11px}.agent-card .live-text .cp,.agent-card .live-text .lang{display:none}
.agent-card .live-text .md-h{font-weight:600;color:var(--text)}
.agent-card .more{padding-left:12px}
.agent-card .ac-head{cursor:pointer;user-select:none}
.agent-card .ac-tg{background:transparent;border:0;color:var(--ac);font:14px/1 var(--mono);padding:0 2px;cursor:pointer;width:16px}
.agent-card .ac-head:hover .ac-tg{color:var(--text)}
.agent-card .ac-peek{font:12px/1.5 var(--mono);color:var(--quiet);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:10px;border-left:2px solid var(--line)}
.agent-card>header{margin-bottom:8px}

.agent-card{overflow:hidden}
.agent-card .steps{grid-template-columns:minmax(0,1fr)}
.agent-card .step{min-width:0}
.agent-card .thought{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0;white-space:normal}
.agent-card>header{min-width:0}
.agent-card .live-text,.agent-card .report{min-width:0;max-width:100%}

.agent-card .agent-note{font:11px/1.5 var(--mono);color:#6a6a6a;margin:0 0 8px;padding-bottom:6px;border-bottom:1px dashed var(--line)}


/* Loader : le logo redessiné en vectoriel, qui MARCHE SUR PLACE (pattes en alternance, corps qui rebondit, tête qui balance, sol qui défile) */
.walker{display:inline-block;width:26px;height:28px;vertical-align:middle;margin-right:10px}.walker svg{width:100%;height:100%;overflow:visible;display:block}
.walker .c1{fill:var(--lime)}.walker .c2{fill:var(--pink)}.walker .eye{fill:var(--bg)}.walker .ground{stroke:#3a3a3a;stroke-width:3;stroke-dasharray:7 7;animation:wground .8s linear infinite}
.walker .leg{transform-box:fill-box;transform-origin:50% 0;animation:wstep .8s infinite ease-in-out}.walker .leg.b{animation-delay:-.4s}
.walker .bodyg{animation:wbob .4s infinite ease-in-out alternate}.walker .headg{transform-box:fill-box;transform-origin:0 100%;animation:wnod .8s infinite ease-in-out}
@keyframes wstep{0%,100%{transform:translateY(0) rotate(-16deg)}50%{transform:translateY(-4px) rotate(16deg)}}
@keyframes wbob{from{transform:translateY(0)}to{transform:translateY(-2px)}}
@keyframes wnod{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes wground{to{stroke-dashoffset:-14}}
@media (prefers-reduced-motion:reduce){.walker .ground,.walker .leg,.walker .bodyg,.walker .headg{animation:none}}
.approval.auto{border-color:#4d7a1e;background:#0d140a;opacity:1;padding:8px 12px}.approval.auto .call{margin:0}.approval.auto h4{color:var(--lime)}
.message.compacted{opacity:.5}.message.compacted .message-role small{color:var(--orange)}

/* markdown + coloration syntaxique */
.md{white-space:normal;overflow-wrap:anywhere}.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p{margin:.55em 0}.md .md-h{font-weight:700;margin:1.1em 0 .35em;line-height:1.3}.md .h1{font-size:1.4em}.md .h2{font-size:1.22em}.md .h3{font-size:1.08em}
.md ul,.md ol{margin:.4em 0;padding-left:1.5em}.md li{margin:.18em 0}.md li>ul,.md li>ol{margin:.1em 0}.md li.task{list-style:none;margin-left:-1.2em}.md li.task .box{color:var(--lime)}
.md blockquote{margin:.6em 0;padding:.15em 0 .15em 12px;border-left:3px solid var(--orange);color:var(--soft)}.md hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.md table{border-collapse:collapse;margin:.7em 0;display:block;overflow-x:auto;max-width:100%}.md th,.md td{border:1px solid var(--line);padding:5px 10px;vertical-align:top}.md th{background:#151515;font-weight:600}
.md a{color:var(--sky);text-decoration:underline;text-underline-offset:2px}.md del{opacity:.6}.md em{font-style:italic}
.fv-bar{position:sticky;top:0;z-index:2;display:flex;gap:6px;padding:8px 12px;background:#0b0b0b;border-bottom:1px solid var(--line)}.fv-bar button{background:transparent;border:1px solid var(--line);color:var(--soft);font:10px var(--mono);letter-spacing:.5px;padding:5px 10px;cursor:pointer}.fv-bar button.on{color:#090909;background:var(--orange);border-color:var(--orange)}
.fv-md{padding:16px 22px 40px;font:14px/1.7 var(--sans);color:var(--text)}
.hl-kw{color:#ff8ad8}.hl-str{color:#b4f08a}.hl-com{color:#7d8590;font-style:italic}.hl-num,.hl-cn,.hl-dec{color:#ffb454}.hl-fn,.hl-key{color:#79c0ff}.hl-cls{color:#ffd866}.hl-tag{color:#ff8ad8}.hl-vr{color:#ffd866}
</style>

<script>
(() => {
'use strict';
const KEY='agentos-brut-v1', PREFS='agentos-prefs-v1';
const $=id=>document.getElementById(id);
const skillSel=$('skill'),ctxLine=$('ctxLine'),ctxText=$('ctxText'),ctxFill=$('ctxFill'),compactBtn=$('compactBtn');
const app=$('app'),feed=$('feed'),threads=$('threads'),prompt=$('prompt'),agent=$('agent'),modeSel=$('mode'),deleg=$('delegation'),autoBox=$('auto'),sendBtn=$('send'),statusEl=$('status'),foot=$('foot');
function makeId(){return typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():(Date.now().toString(16)+'-'+Math.random().toString(16).slice(2,10)).padEnd(12,'0')}

// --- jeton : transmis dans le fragment de l'URL affichée par `cc-web` (jamais envoyé au serveur dans l'URL) ---
let token='';
try{const h=new URLSearchParams(location.hash.slice(1)).get('token');if(h){localStorage.setItem('cc-token',h);history.replaceState(null,'',location.pathname+location.search)}token=localStorage.getItem('cc-token')||''}catch{}
function askToken(){const t=window.prompt('Jeton d’accès (affiché au lancement de cc-web, ou contenu du fichier ~/.claude_clone/web_token) :');if(t&&t.trim()){token=t.trim();try{localStorage.setItem('cc-token',token)}catch{}return true}return false}
const api=(path,opts={})=>{const headers={'X-CC-Token':token,...(opts.headers||{})};if(opts.body)headers['Content-Type']='application/json';return fetch(path,{...opts,headers})};

// --- état local (conversations) + préférences ---
let state={active:null,conversations:[]};
try{const p=JSON.parse(localStorage.getItem(KEY));if(p&&Array.isArray(p.conversations))state=p}catch{}
const gone=new Set();let wantNew=false;
try{const q=new URLSearchParams(location.search);const want=q.get('c')||sessionStorage.getItem('cc-active');wantNew=q.get('new')==='1';
 if(want&&state.conversations.some(c=>c.id===want))state.active=want;
 if(q.has('c')||q.has('new')){q.delete('c');q.delete('new');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:''))}}catch{}
let prefs={agent:'auto',mode:'challenge',auto:false,delegation:'balanced'};
try{Object.assign(prefs,JSON.parse(localStorage.getItem(PREFS))||{})}catch{}
agent.value=prefs.agent;modeSel.value=prefs.mode;deleg.value=prefs.delegation||'balanced';autoBox.checked=!!prefs.auto;
if(agent.value!==prefs.agent)agent.value='auto';
function savePrefs(){prefs={agent:agent.value,mode:modeSel.value,auto:autoBox.checked,delegation:deleg.value};try{localStorage.setItem(PREFS,JSON.stringify(prefs))}catch{}}
agent.onchange=modeSel.onchange=deleg.onchange=savePrefs;
const autoLabel=document.querySelector('label.auto');const paintAuto=()=>autoLabel.classList.toggle('on',autoBox.checked);paintAuto();
autoBox.onchange=()=>{savePrefs();paintAuto();if(autoBox.checked)reevaluate()};
function mergeStored(){let st=null;try{st=JSON.parse(localStorage.getItem(KEY))}catch{}
 if(!st||!Array.isArray(st.conversations))return;
 const mine=new Map(state.conversations.map(c=>[c.id,c])),out=[];
 for(const c of st.conversations){if(gone.has(c.id))continue;out.push(c.id===state.active&&mine.has(c.id)?mine.get(c.id):c);mine.delete(c.id)}
 for(const c of mine.values())if(!gone.has(c.id))out.unshift(c);
 state.conversations=out}
function save(){try{mergeStored();localStorage.setItem(KEY,JSON.stringify(state));sessionStorage.setItem('cc-active',state.active||'')}catch(e){console.warn('Sauvegarde impossible',e)}}
function openTab(id){const q=id?'?c='+encodeURIComponent(id):'?new=1',w=Math.round(screen.availWidth/2),h=screen.availHeight;window.open(location.pathname+q,'_blank','popup=yes,width='+w+',height='+h+',left='+(screen.availLeft||0)+w+',top='+(screen.availTop||0))}
addEventListener('storage',e=>{if(e.key!==KEY)return;const cur=current();mergeStored();if(cur&&!state.conversations.some(c=>c.id===cur.id))state.conversations.unshift(cur);renderThreads()})
const current=()=>state.conversations.find(c=>c.id===state.active);
let roleTitles={coder:'AGENT CODEUR'};
const label=k=>(roleTitles[k]||String(k||'AGENT')).toUpperCase();

let ctxInfo=null,supModel='',busy=false,controller=null,raf=0,runStart=0,lastEvent=0;
function tickText(){if(!busy||!runStart)return '';const t=Math.floor((Date.now()-runStart)/1000),q=Math.floor((Date.now()-lastEvent)/1000);return t+' s'+(q>=6&&t-q>=2?' · '+q+' s sans signal':'')}
let liveM=null;
function progress(m){if(!m||!m.blocks)return null;const t=Math.floor((Date.now()-runStart)/1000),parts=[];let pct=null;
 const tools=m.blocks.filter(b=>b.t==='tool'&&b.name!=='update_plan'),ag=tools.filter(b=>b.agent),direct=tools.filter(b=>!b.agent),plan=m.blocks.find(b=>b.t==='plan');
 if(plan&&plan.todos?.length){const d=plan.todos.filter(x=>x.status==='completed').length,n=plan.todos.length;pct=Math.round(100*d/n);parts.push('étape '+Math.min(d+1,n)+'/'+n)}
 if(ag.length){const d=ag.filter(b=>b.status!=='run').length;parts.push(d+'/'+ag.length+' agents terminés');if(pct===null&&d<ag.length)pct=Math.round(100*d/ag.length)}
 if(direct.length)parts.push(direct.length+' outil'+(direct.length>1?'s':''));
 const ch=m.chars||0;if(ch>=400)parts.push('~'+(ch>=4000?Math.round(ch/400)/10+'k':Math.round(ch/4))+' tokens reçus'+(t>=3?' ('+Math.round(ch/4/t)+'/s)':''));
 if(!parts.length||(t<6&&!direct.length&&!ag.length&&!plan))return null;return{text:parts.join(' · '),pct}}
function paintProgress(){document.querySelectorAll('.status-stats').forEach(e=>{const r=progress(liveM);e.textContent=r?r.text:'';const f=e.parentElement?.querySelector('.status-bar i');if(f)f.style.width=(r&&r.pct!==null?r.pct:0)+'%';const bar=e.parentElement?.querySelector('.status-bar');if(bar)bar.hidden=!(r&&r.pct!==null)})}
setInterval(()=>{if(busy){document.querySelectorAll('.status-time').forEach(e=>e.textContent=tickText());paintProgress()}},500);
function closeMenu(){app.classList.remove('menu-open')}
function start(){ctxInfo=null;const c={id:makeId(),title:'Nouvelle conversation',messages:[],created:Date.now()};state.conversations.unshift(c);state.active=c.id;save();render();closeMenu();prompt.focus()}

    case 'plan':{const i=m.blocks.findIndex(x=>x.t==='plan');const b={t:'plan',todos:ev.todos};if(i>=0)m.blocks[i]=b;else m.blocks.push(b)}break;
    case 'notice':m.blocks.push({t:'notice',level:ev.level,text:ev.text});break;
    case 'auto':if(ev.preview){closeText(m);m.blocks.push({t:'approval',calls:[{id:ev.id||('auto-'+Date.now()),name:ev.name,summary:ev.summary,preview:ev.preview}],choices:{},resolved:true,auto:true,decided:{}})}else m.blocks.push({t:'notice',level:'info',text:'⚡ auto : '+ev.name+'('+ev.summary+') — '+ev.why});break;

}
async function run(endpoint,payload,m){
  busy=true;liveM=m;m.chars=0;controller=new AbortController();runStart=lastEvent=Date.now();m.status=m.status||'Réflexion…';render();
  try{
    const r=await api(endpoint,{method:'POST',body:JSON.stringify(payload),signal:controller.signal});
    if(!r.ok){let d='';try{d=(await r.json()).detail||''}catch{}
      m.blocks.push({t:'notice',level:'warn',text:r.status===401?(askToken()?'Jeton mis à jour : renvoie ton message.':'Jeton absent ou invalide : recharge la page pour le saisir.'):r.status===409?(d||'Un tour est déjà en cours.'):'Erreur '+r.status+(d?' : '+d:'')});return}
    const reader=r.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){const {value,done}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(line){try{handle(JSON.parse(line),m)}catch(e){console.warn('Événement illisible',line)}schedule()}}}
  }catch(e){m.blocks.push({t:'notice',level:'warn',text:e.name==='AbortError'?'Interrompu.':'Connexion perdue : '+e.message});if(e.name!=='AbortError')setStatus(false)}
  finally{busy=false;liveM=null;controller=null;runStart=0;m.status='';closeText(m);save();render()}
}

async function reevaluate(){

    if(!waiting){b.resolved=true;b.decided={};m.blocks.push({t:'notice',level:'info',text:'Confirmation expirée ou déjà traitée.'});save();render();return}
    if(!pending){m.blocks.push({t:'notice',level:'info',text:'⚡ AUTO : plus rien à confirmer, reprise automatique.'});b.choices={};resume(m,b);return}

    setStatus(true,'<b>STUDIO / LOCAL</b><br>'+esc(meta.workdir)+'<br>'+(meta.sandbox?'bash isolé':'bash NON isolé')+(meta.models&&meta.models.superviseur?'<br>superviseur : '+esc(String(meta.models.superviseur).split('/').pop()):''));
    syncPending();refreshCtx();loadSkills()}catch{setStatus(false,'<b>HORS LIGNE</b><br>Serveur injoignable')}
}
$('chatForm').addEventListener('submit',e=>{e.preventDefault();submit()});
prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();submit()}});
$('newConversation').onclick=()=>{if(!busy)start()};$('newTab').onclick=()=>openTab();$('menuToggle').onclick=()=>app.classList.toggle('menu-open');
if(!current()||wantNew)start();else render();
init();
})();
